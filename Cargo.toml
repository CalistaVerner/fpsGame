[workspace]
resolver = "2"
members = ["newengine-game-fps"]

[workspace.package]
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
abi_stable = "0.11"
newengine-plugin-api = { package = "newengine-plugin-kit", path = "../../NewEngine/neocore2/crates/newengine-plugin-kit" }
serde_json = "1"
newengine-game-module-fps = { path = "../../NewEngine/neocore2/crates/newengine-game-module-fps" }
newengine-game-ready-profile = { path = "../../NewEngine/neocore2/crates/newengine-game-ready-profile" }
newengine-project-api = { path = "../../NewEngine/neocore2/crates/newengine-project-api" }

[profile.release]
debug = 0
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
