[workspace]
resolver = "2"
members = ["newengine-game-fps"]

[workspace.package]
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
abi_stable = "0.11"
newengine-plugin-api = { package = "newengine-plugin-kit", path = "../../NewEngine/neocore2/crates/newengine-plugin-kit" }
serde_json = "1"
newengine-game-module-api = { path = "../../NewEngine/neocore2/crates/newengine-game-module-api" }
newengine-game-module-fps-contract = { path = "../../NewEngine/neocore2/crates/newengine-game-module-fps-contract" }

[profile.release]
debug = 0
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
